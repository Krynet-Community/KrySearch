<!DOCTYPE html>
<html lang="en-US" class="h-full bg-gray-900">
<head>
  <script>
    // Early error boundary to prevent script failures from breaking UI
    window.addEventListener('error', function(e) {
      console.error('[KrySearch] Critical error:', e.message);
    });
    globalThis.ns_setupCallback = globalThis.ns_setupCallback || function() {};
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>KrySearch - Privacy-Focused Search</title>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Secure, privacy-focused search engine with anti-fingerprinting protection">
  <meta http-equiv="Permissions-Policy" content="accelerometer=(),ambient-light-sensor=(),autoplay=(),battery=(),camera=(),clipboard-read=(),clipboard-write=(),display-capture=(),document-domain=(),encrypted-media=(),fullscreen=(),geolocation=(),gyroscope=(),hid=(),idle-detection=(),interest-cohort=(),magnetometer=(),microphone=(),midi=(),payment=(),picture-in-picture=(),publickey-credentials-get=(),screen-wake-lock=(),serial=(),usb=(),web-share=(),xr-spatial-tracking=()">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Krynet-LLC/KrySearch/main/lgoo.png">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="dns-prefetch" href="https://esm.sh">
</head>
<body class="flex items-center justify-center h-screen text-gray-100 m-0 overflow-hidden bg-gray-900">
  <div id="app" class="w-full max-w-md mx-auto p-4 flex flex-col items-center justify-center gap-6">
    <img src="https://raw.githubusercontent.com/Krynet-LLC/KrySearch/main/lgoo.png" alt="KrySearch Logo" class="w-24 h-24 object-contain" loading="eager" width="96" height="96">
    <form action="/search.js" method="get" class="w-full flex flex-col gap-3">
      <input 
        type="text" 
        name="q" 
        id="search-input"
        placeholder="Search securely..." 
        class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors"
        required
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 font-medium text-white rounded-xl transition-colors">
        KrySearch Secure Route
      </button>
    </form>
  </div>
  <noscript class="text-center p-6 text-red-400 max-w-md mx-auto bg-gray-800 rounded-2xl border border-red-900">
    <p class="font-bold mb-4">JavaScript is required for advanced anti-fingerprinting protection.</p>
    <form action="/" method="get" class="flex flex-col gap-2">
      <input type="text" name="q" placeholder="Enter your search" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-xl text-white">
      <button type="submit" class="w-full py-2 bg-red-600 text-white rounded-xl">Basic Search</button>
    </form>
  </noscript>
  <script type="module" src="search.js"></script>
</body>
</html>
