    body {
      background: #111827;

      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 4px solid #374151;

      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {

      100% { transform: rotate(360deg); }
    }
  </style>
</head>
